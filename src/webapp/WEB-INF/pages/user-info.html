<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:form="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>
<h2>User Info</h2>
<form th:action="@{/saveUser}" th:object="${user}" method="post">

    <input type="hidden" th:field="*{id}"/>

    Name <input type="text" th:field="*{name}"/>
    <br><br>
    Surname <input type="text" th:field="*{surname}"/>
    <br><br>
    Department <input type="text" th:field="*{department}"/>
    <br><br>
    Salary <input type="text" th:field="*{salary}"/>
    <br><br>
    <input type="submit" value="OK">

</form>

</body>
</html>
